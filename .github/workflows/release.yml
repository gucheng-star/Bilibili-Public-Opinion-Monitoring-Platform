name: Portable Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    env:
      BILI_PORTABLE_UPDATE_PUBLIC_KEY: ${{ secrets.PORTABLE_UPDATE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend test and packaging dependencies
        shell: pwsh
        run: |
          python -m venv backend\venv
          backend\venv\Scripts\python.exe -m pip install --upgrade pip
          backend\venv\Scripts\python.exe -m pip install -r backend\requirements-portable.txt
      - name: Run backend tests
        shell: pwsh
        run: |
          Set-Location backend
          .\venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Install and validate frontend
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run lint
          pnpm --dir frontend run build
      - name: Build single Tauri portable executable
        shell: pwsh
        run: pnpm --dir frontend run tauri:build
      - name: Run Rust unit tests
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --bins
      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path frontend\src-tauri\Cargo.toml -- --check
      - name: Assemble single-file portable executable
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          .\scripts\assemble-portable.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Sign portable manifest payload
        shell: pwsh
        env:
          PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64: ${{ secrets.PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64)) { throw "Missing PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64" }
          $privateKey = Join-Path $env:RUNNER_TEMP "portable-update-private.pem"
          [IO.File]::WriteAllBytes($privateKey, [Convert]::FromBase64String($env:PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64))
          $version = "${{ steps.package.outputs.version }}"
          $assetPath = Join-Path "dist\portable" "BiliOpinionMonitor-$version-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) { throw "Missing expected versioned portable executable: $assetPath" }
          $asset = Get-Item -LiteralPath $assetPath
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $payload = "1|${{ steps.package.outputs.version }}|$($asset.Name)|$($asset.Length)|$hash"
          $payloadPath = Join-Path $env:RUNNER_TEMP "portable-manifest-payload.txt"
          $signaturePath = Join-Path $env:RUNNER_TEMP "portable-manifest.sig"
          [IO.File]::WriteAllText($payloadPath, $payload, [Text.UTF8Encoding]::new($false))
          openssl pkeyutl -sign -rawin -inkey $privateKey -in $payloadPath -out $signaturePath
          $signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
          .\scripts\new-portable-manifest.ps1 -Version "${{ steps.package.outputs.version }}" -AssetPath $asset.FullName -ReleaseBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" -NotesUrl "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" -SignatureBase64 $signature -OutputPath "dist\portable\latest-portable.json"
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: B站舆论监测平台 v${{ steps.package.outputs.version }}
          body: |
            ## 下载与使用

            下载 `BiliOpinionMonitor-${{ steps.package.outputs.version }}-windows-x64.exe` 后，可直接双击运行，无需安装 Python、Node.js 或 Rust。

            首次启动会在 EXE 同级创建 `data/` 目录，用于保存数据库、登录信息、模型设置和日志。更新前请备份该目录，且不要在更新时删除或覆盖它。

            当前为预发布版本，可能触发 Windows SmartScreen 提示。请只从本仓库 Release 页面下载，并可使用随发布生成的 `latest-portable.json` 核对文件大小与 SHA-256。
          generate_release_notes: true
          prerelease: ${{ startsWith(steps.package.outputs.version, '0.') }}
          files: |
            dist/portable/*.exe
            dist/portable/latest-portable.json
