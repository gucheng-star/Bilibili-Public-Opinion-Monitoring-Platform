name: Portable Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    env:
      BILI_PORTABLE_UPDATE_PUBLIC_KEY: ${{ secrets.PORTABLE_UPDATE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate portable update signing keys
        shell: pwsh
        env:
          PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64: ${{ secrets.PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64 }}
        run: |
          .\scripts\validate-portable-signing-keys.ps1 -OutputDirectory $env:RUNNER_TEMP
      - name: Install backend test and packaging dependencies
        shell: pwsh
        run: |
          python -m venv backend\venv
          backend\venv\Scripts\python.exe -m pip install --upgrade pip
          backend\venv\Scripts\python.exe -m pip install -r backend\requirements-portable.txt
          backend\venv\Scripts\python.exe -m pip install -r backend\requirements-agent-mcp-build.txt
      - name: Run backend tests
        shell: pwsh
        run: |
          Set-Location backend
          .\venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Install and validate frontend
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run lint
          pnpm --dir frontend run build
      - name: Build single Tauri portable executable
        shell: pwsh
        run: pnpm --dir frontend run tauri:build
      - name: Run Rust unit tests
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --bins
      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path frontend\src-tauri\Cargo.toml -- --check
      - name: Assemble single-file portable executable
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          .\scripts\assemble-portable.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Smoke-test versioned release EXE MCP stdio mode
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $assetPath = Join-Path "dist\portable" "BiliOpinionMonitor-$version-windows-x64.exe"
          backend\venv\Scripts\python.exe .\scripts\smoke-final-mcp.py $assetPath
      - name: Sign portable manifest payload
        shell: pwsh
        env:
          PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64: ${{ secrets.PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64)) { throw "Missing PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64" }
          $privateKey = Join-Path $env:RUNNER_TEMP "portable-update-private.pem"
          [IO.File]::WriteAllBytes($privateKey, [Convert]::FromBase64String($env:PORTABLE_UPDATE_PRIVATE_KEY_PEM_B64))
          $version = "${{ steps.package.outputs.version }}"
          $assetPath = Join-Path "dist\portable" "BiliOpinionMonitor-$version-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) { throw "Missing expected versioned portable executable: $assetPath" }
          $asset = Get-Item -LiteralPath $assetPath
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $payload = "1|${{ steps.package.outputs.version }}|$($asset.Name)|$($asset.Length)|$hash"
          $payloadPath = Join-Path $env:RUNNER_TEMP "portable-manifest-payload.txt"
          $signaturePath = Join-Path $env:RUNNER_TEMP "portable-manifest.sig"
          [IO.File]::WriteAllText($payloadPath, $payload, [Text.UTF8Encoding]::new($false))
          openssl pkeyutl -sign -rawin -inkey $privateKey -in $payloadPath -out $signaturePath
          if ($LASTEXITCODE -ne 0) { throw "Unable to sign the portable update manifest payload" }
          $publicKey = Join-Path $env:RUNNER_TEMP "portable-update-public.pem"
          if (-not (Test-Path -LiteralPath $publicKey -PathType Leaf)) { throw "Missing validated portable update public key" }
          openssl pkeyutl -verify -pubin -inkey $publicKey -rawin -in $payloadPath -sigfile $signaturePath
          if ($LASTEXITCODE -ne 0) { throw "Portable update manifest signature verification failed" }
          $signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
          $manifestPath = "dist\portable\latest-portable.json"
          .\scripts\new-portable-manifest.ps1 -Version "${{ steps.package.outputs.version }}" -AssetPath $asset.FullName -ReleaseBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" -NotesUrl "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" -SignatureBase64 $signature -OutputPath $manifestPath
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $manifestPayload = "$($manifest.schema)|$($manifest.version)|$($manifest.asset.name)|$($manifest.asset.size)|$($manifest.asset.sha256)"
          if ($manifestPayload -cne $payload) { throw "Portable update manifest payload does not match the signed payload" }
          if ($manifest.signature -cne $signature) { throw "Portable update manifest signature was not preserved" }
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          name: B站舆论监测平台 v${{ steps.package.outputs.version }}
          body: |
            ## 0.2.2 更新

            - 新增评论明细 CSV 导出，可按当前筛选结果保存数据。
            - 改进评论情绪标签展示与导出预处理。
            - 词云统一使用前端渲染，移除遗留的后端 PNG 词云接口及相关打包依赖。
            - 补充产品使用说明、界面预览与本地优先隐私政策。

            ## 下载与使用

            下载 `BiliOpinionMonitor-${{ steps.package.outputs.version }}-windows-x64.exe` 后，可直接双击运行，无需安装 Python、Node.js 或 Rust。

            首次启动会在 EXE 同级创建 `data/` 目录，用于保存数据库、登录信息、模型设置和日志。更新前请备份该目录，且不要在更新时删除或覆盖它。

            当前为 0.x 预正式阶段，可能触发 Windows SmartScreen 提示。请只从本仓库 Release 页面下载，并可使用随发布生成的 `latest-portable.json` 核对文件大小与 SHA-256。
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist/portable/*.exe
            dist/portable/latest-portable.json
      - name: Verify published portable update channel
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $assetName = "BiliOpinionMonitor-$version-windows-x64.exe"
          $expectedAssetUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$assetName"
          $manifestUrl = "https://github.com/${{ github.repository }}/releases/latest/download/latest-portable.json"
          $manifest = $null
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $manifest = Invoke-RestMethod -Uri $manifestUrl -Headers @{ "Cache-Control" = "no-cache" } -TimeoutSec 30
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Start-Sleep -Seconds 10
            }
          }
          if ($manifest.version -cne $version) { throw "Published update manifest version mismatch" }
          if ($manifest.asset.name -cne $assetName) { throw "Published update asset name mismatch" }
          if ($manifest.asset.url -cne $expectedAssetUrl) { throw "Published update asset URL mismatch" }
          if ([string]::IsNullOrWhiteSpace($manifest.signature)) { throw "Published update manifest signature is missing" }
          $assetResponse = Invoke-WebRequest -Uri $expectedAssetUrl -Method Head -MaximumRedirection 10 -TimeoutSec 30
          if ($assetResponse.StatusCode -lt 200 -or $assetResponse.StatusCode -ge 400) { throw "Published portable asset is not downloadable" }
